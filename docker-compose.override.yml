services:
  web:
    build: .
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./src:/app/src
      - ./public:/app/public
    environment:
      - NODE_ENV=development
      - VITE_API_BASE_URL=http://localhost:3000/api

  backend:
    command: node backend-node/server.js
    volumes:
      - ./backend-node:/app/backend-node
